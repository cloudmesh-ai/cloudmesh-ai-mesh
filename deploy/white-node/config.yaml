model_list:
  - model_name: gemma-ultra
    litellm_params:
      model: openai/google/gemma-4-31B-it
      api_base: http://gemma-server:18123/v1
      api_key: "local"
  - model_name: gpu-primary
    litellm_params:
      model: openai/qwen
      api_base: http://vllm:8000/v1
      api_key: "local"
  - model_name: cpu-fallback
    litellm_params:
      model: openai/qwen
      api_base: http://spark-node:8080/v1
      api_key: "local"

router_settings:
  routing_strategy: "fallback"
  fallback_model_list:
    - gemma-ultra: ["gpu-primary", "cpu-fallback"]
    - gpu-primary: ["cpu-fallback"]
